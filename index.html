<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RKC 2024 Reflection</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to bottom, #f9f9f9, #e2d4c3);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 400px;
      height: 400px;
      background-color: #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .mala {
      position: relative;
      width: 300px;
      height: 300px;
      animation: rotate 20s linear infinite;
    }

    .bead {
      position: absolute;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #8B4513, #5a2e15);
      border: 2px solid #D2691E;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .bead:hover {
      transform: scale(1.2);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
    }

    .prompt {
      position: absolute;
      bottom: -100px;
      width: 350px;
      text-align: center;
      display: none;
      animation: fadeIn 0.5s forwards;
    }

    .prompt textarea {
      width: 100%;
      height: 80px;
      margin-top: 10px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .prompt button {
      margin-top: 10px;
      padding: 8px 12px;
      font-size: 14px;
      color: white;
      background-color: #007aff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .prompt button:hover {
      background-color: #005eb8;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .bead[data-index="0"] { top: 0; left: 50%; transform: translate(-50%, -50%); }
    .bead[data-index="1"] { top: 15%; left: 85%; transform: translate(-50%, -50%); }
    .bead[data-index="2"] { top: 50%; left: 100%; transform: translate(-50%, -50%); }
    .bead[data-index="3"] { top: 85%; left: 85%; transform: translate(-50%, -50%); }
    .bead[data-index="4"] { top: 100%; left: 50%; transform: translate(-50%, -50%); }
    .bead[data-index="5"] { top: 85%; left: 15%; transform: translate(-50%, -50%); }
    .bead[data-index="6"] { top: 50%; left: 0; transform: translate(-50%, -50%); }
    .bead[data-index="7"] { top: 15%; left: 15%; transform: translate(-50%, -50%); }
  </style>
</head>
<body>
  <div class="container">
    <div class="mala">
      <div class="bead" data-index="0" title="January"></div>
      <div class="bead" data-index="1" title="February"></div>
      <div class="bead" data-index="2" title="March"></div>
      <div class="bead" data-index="3" title="April"></div>
      <div class="bead" data-index="4" title="May"></div>
      <div class="bead" data-index="5" title="June"></div>
      <div class="bead" data-index="6" title="July"></div>
      <div class="bead" data-index="7" title="August"></div>
    </div>
    <div class="prompt" id="reflectionPrompt">
      <p id="promptText">What made this month special?</p>
      <textarea id="reflectionInput" placeholder="Write your reflection here..."></textarea>
      <button id="saveReflection">Save Reflection</button>
    </div>
  </div>

  <script>
    const beads = document.querySelectorAll('.bead');
    const prompt = document.getElementById('reflectionPrompt');
    const promptText = document.getElementById('promptText');
    const reflectionInput = document.getElementById('reflectionInput');

    beads.forEach((bead, index) => {
      bead.addEventListener('click', () => {
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August"];
        prompt.style.display = 'block';
        promptText.textContent = `Reflect on ${monthNames[index]}`;
      });
    });

    document.getElementById('saveReflection').addEventListener('click', () => {
      alert(`Reflection saved: ${reflectionInput.value}`);
      reflectionInput.value = '';
      prompt.style.display = 'none';
    });
  </script>
</body>
</html>
