<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RKC 2024 Reflection</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to bottom, #f9f9f9, #e2d4c3);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 400px;
      height: 400px;
      background-color: #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .profile {
      position: absolute;
      text-align: center;
    }

    .profile img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 8px;
    }

    .profile h2 {
      font-size: 18px;
      color: #333;
      margin: 0;
    }

    .mala {
      position: relative;
      width: 300px;
      height: 300px;
      animation: rotate 20s linear infinite;
    }

    .bead {
      position: absolute;
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #8B4513, #5a2e15);
      border: 2px solid #D2691E;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .bead img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .bead[data-type="small"] {
      width: 20px;
      height: 20px;
    }

    .bead[data-type="large"] {
      width: 60px;
      height: 60px;
    }

    .upload {
      position: absolute;
      bottom: -60px;
      text-align: center;
    }

    .upload input {
      display: none;
    }

    .upload label {
      display: inline-block;
      padding: 10px 20px;
      background-color: #007aff;
      color: white;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .upload label:hover {
      background-color: #005eb8;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .bead[data-index="0"] { top: 0; left: 50%; transform: translate(-50%, -50%); }
    .bead[data-index="1"][data-type="small"] { top: 15%; left: 75%; transform: translate(-50%, -50%); }
    .bead[data-index="2"] { top: 50%; left: 100%; transform: translate(-50%, -50%); }
    .bead[data-index="3"][data-type="large"] { top: 85%; left: 75%; transform: translate(-50%, -50%); }
    .bead[data-index="4"] { top: 100%; left: 50%; transform: translate(-50%, -50%); }
    .bead[data-index="5"][data-type="small"] { top: 85%; left: 25%; transform: translate(-50%, -50%); }
    .bead[data-index="6"] { top: 50%; left: 0%; transform: translate(-50%, -50%); }
    .bead[data-index="7"][data-type="large"] { top: 15%; left: 25%; transform: translate(-50%, -50%); }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <div class="profile">
      <img id="profile-pic" src="https://via.placeholder.com/80" alt="Profile Picture">
      <h2 id="user-name">Your Name</h2>
    </div>
    <div class="mala" id="mala">
      <div class="bead" data-index="0"></div>
      <div class="bead" data-index="1" data-type="small"></div>
      <div class="bead" data-index="2"></div>
      <div class="bead" data-index="3" data-type="large"></div>
      <div class="bead" data-index="4"></div>
      <div class="bead" data-index="5" data-type="small"></div>
      <div class="bead" data-index="6"></div>
      <div class="bead" data-index="7" data-type="large"></div>
    </div>
    <div class="upload">
      <input type="file" id="upload-input" multiple accept="image/*">
      <label for="upload-input">Upload Pictures</label>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const telegram = window.Telegram.WebApp;
      const user = telegram.initDataUnsafe?.user || {};

      const userNameElement = document.getElementById('user-name');
      const profilePicElement = document.getElementById('profile-pic');

      if (user) {
        userNameElement.textContent = user.first_name || "Your Name";
        profilePicElement.src = user.photo_url || "https://via.placeholder.com/80";
      }

      const uploadInput = document.getElementById('upload-input');
      const mala = document.getElementById('mala');

      uploadInput.addEventListener('change', (event) => {
        const files = Array.from(event.target.files).slice(0, 5); // Limit to 5 files
        const beads = mala.querySelectorAll('.bead');

        beads.forEach((bead, index) => {
          if (files[index]) {
            const reader = new FileReader();
            reader.onload = (e) => {
              bead.innerHTML = `<img src="${e.target.result}" alt="Picture">`;
            };
            reader.readAsDataURL(files[index]);
          } else {
            bead.innerHTML = '';
          }
        });
      });

      telegram.expand();
    });
  </script>
</body>
</html>
